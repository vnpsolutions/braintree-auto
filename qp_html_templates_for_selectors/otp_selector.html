<script type="text/javascript">

    //var code;

    const inputs = document.getElementById("inputs");
  
    document.getElementById('code1').addEventListener('paste', (e) => {


        var pastedData = e.clipboardData?.getData('text')
        if (!pastedData || isNaN(parseInt(pastedData))) {
            e.preventDefault()
            e.stopPropagation()
            return
        }

        var codes = pastedData.split('')
        if (codes.length > 6) {
            codes.splice(6)
        }


        document.getElementById('code1').value = codes[0] ?? ''
        document.getElementById('code2').value = codes[1] ?? ''
        document.getElementById('code3').value = codes[2] ?? ''
        document.getElementById('code4').value = codes[3] ?? ''
        document.getElementById('code5').value = codes[4] ?? ''
        document.getElementById('code6').value = codes[5] ?? ''

        //code = codes.join('')
        //document.getElementById('code1').value.blur()

        e.preventDefault()
        e.stopPropagation()

    });


    inputs.addEventListener("input", function (e) {
        const target = e.target;
        const val = target.value;

        if (isNaN(val)) {
            target.value = "";
            return;
        }

 
        if (val != "") {
            const next = target.nextElementSibling;
            if (next) {
                next.focus();
            }

        }
    });

    inputs.addEventListener("keyup", function (e) {
        const target = e.target;
        const key = e.key.toLowerCase();

        if (key == "backspace" || key == "delete") {
            target.value = "";
            const prev = target.previousElementSibling;
            if (prev) {
                prev.focus();
            }
            return;
        }
    });          
</script>
