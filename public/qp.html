<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quantum Pay Automation</title>
    <link rel="stylesheet" href="qp.css">
  </head>
  <body>
    <div class="container">
      <div class="brand">
        <img
          class="brand-logo"
          src="https://www.vnpsolutions.com/_next/static/media/logo.0b03bd70.svg"
          alt="VNP Solutions"
        >
      </div>
      <h1>Quantum Pay Automation</h1>
      <form id="start-form">
        <div class="form-row">
          <label for="inputFile">Input File (Excel .xlsx)</label>
          <input type="file" id="inputFile" name="inputFile" accept=".xlsx" required>
        </div>
        <div class="form-row">
          <label>Mode</label>
          <div class="inline">
            <label><input type="radio" name="review" value="review" checked> Review</label>
            <label><input type="radio" name="review" value="no-review"> No Review</label>
          </div>
        </div>
        <div class="buttons">
          <button type="submit" id="startBtn">Start</button>
          <a id="downloadBtn" class="btn-secondary" href="/download" target="_blank" rel="noopener">Download current file</a>
          <button type="button" id="authBtn" class="btn-secondary">Authorize Gmail (OTP)</button>
        </div>
      </form>
      <div id="status" class="status"></div>
      <div id="authStatus" class="status"></div>
      <pre id="log" class="log" aria-live="polite"></pre>
      <p class="hint">
        Keep this page open. Chromium will guide you through Quantum Pay login.
        OTP can be solved automatically if Gmail OAuth is configured.
      </p>
    </div>
    <script src="qp.js"></script>
  </body>
  </html>
